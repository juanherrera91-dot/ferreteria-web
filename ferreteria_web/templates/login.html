<!DOCTYPE html>
<html>
<head>
    <title>Login Ferretería</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body class="bg-dark d-flex justify-content-center align-items-center" style="height:100vh;">

<div class="card p-4 shadow" style="width:350px; border-radius:15px;">
    <h3 class="text-center">🔐 Ferretería Login</h3>

    <form method="POST">
        <input class="form-control mt-3" name="username" placeholder="Usuario">
        <input class="form-control mt-3" type="password" name="password" placeholder="Contraseña">

        <button class="btn btn-primary w-100 mt-3">Ingresar</button>
    </form>
</div>

</body>
</html>
