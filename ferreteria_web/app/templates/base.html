<!DOCTYPE html>
<html lang="es">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0">

    <title>
        Sistema Web de Ferretería
    </title>

    <!-- BOOTSTRAP -->
    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
        rel="stylesheet">

    <!-- ICONOS -->
    <link
        rel="stylesheet"
        href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

    <style>

        /* =========================================
           BODY
        ========================================== */
        body {

            margin: 0;

            padding: 0;

            background: #f4f6f9;

            font-family: Arial, Helvetica, sans-serif;
        }

        /* =========================================
           SIDEBAR
        ========================================== */
        .sidebar {

            position: fixed;

            top: 0;

            left: 0;

            width: 250px;

            height: 100vh;

            background: linear-gradient(
                180deg,
                #212529,
                #343a40
            );

            padding-top: 20px;

            box-shadow: 2px 0px 10px rgba(0,0,0,0.2);

            z-index: 1000;
        }

        /* =========================================
           LOGO
        ========================================== */
        .logo {

            text-align: center;

            margin-bottom: 30px;
        }

        .logo img {

            width: 90px;

            border-radius: 15px;

            margin-bottom: 10px;
        }

        .logo h4 {

            color: white;

            font-weight: bold;
        }

        /* =========================================
           MENU
        ========================================== */
        .menu {

            display: flex;

            flex-direction: column;

            padding: 10px;
        }

        .menu a {

            color: white;

            text-decoration: none;

            padding: 14px 18px;

            margin-bottom: 10px;

            border-radius: 10px;

            transition: 0.3s;

            font-size: 16px;

            font-weight: bold;
        }

        .menu a:hover {

            background: #0d6efd;

            transform: translateX(5px);
        }

        .menu i {

            margin-right: 10px;
        }

        /* =========================================
           CONTENIDO
        ========================================== */
        .main-content {

            margin-left: 250px;

            padding: 25px;
        }

        /* =========================================
           FOOTER
        ========================================== */
        footer {

            margin-left: 250px;

            background: #212529;

            color: white;

            text-align: center;

            padding: 15px;

            margin-top: 30px;
        }

        /* =========================================
           DROPDOWN REPORTES
        ========================================== */
        .submenu {

            margin-left: 15px;

            display: none;

            flex-direction: column;
        }

        .submenu a {

            background: #495057;

            font-size: 14px;

            padding: 10px;
        }

        .show {

            display: flex;
        }

        /* =========================================
           RESPONSIVE
        ========================================== */
        @media(max-width: 768px) {

            .sidebar {

                width: 100%;

                height: auto;

                position: relative;
            }

            .main-content {

                margin-left: 0;
            }

            footer {

                margin-left: 0;
            }
        }

    </style>

</head>

<body>

    <!-- =====================================
         SIDEBAR
    ====================================== -->
    <div class="sidebar">

        <!-- LOGO -->
        <div class="logo">

            <img
                src="{{ url_for('static', filename='logo.png') }}"
                alt="Logo">

            <h4>
                🏪 FERROTODO
            </h4>

        </div>

        <!-- MENU -->
        <div class="menu">

            <!-- HOME -->
            <a href="{{ url_for('views.dashboard') }}">

                <i class="bi bi-house-fill"></i>

                Inicio

            </a>

            <!-- PRODUCTOS -->
            <a href="{{ url_for('views.productos') }}">

                <i class="bi bi-tools"></i>

                Productos

            </a>

            <!-- CLIENTES -->
            <a href="{{ url_for('views.clientes') }}">

                <i class="bi bi-people-fill"></i>

                Clientes

            </a>

            <!-- VENTAS -->
            <a href="{{ url_for('views.ventas') }}">

                <i class="bi bi-cash-stack"></i>

                Ventas

            </a>

            <!-- BOTON REPORTES -->
            <a
                href="#"
                onclick="toggleReportes()">

                <i class="bi bi-bar-chart-fill"></i>

                Reportes IA

            </a>

            <!-- SUBMENU -->
            <div
                class="submenu"
                id="submenu-reportes">

                <a href="{{ url_for('views.reporte1') }}">

                    📈 Reporte 1

                </a>

                <a href="{{ url_for('views.reporte2') }}">

                    📊 Reporte 2

                </a>

                <a href="{{ url_for('views.reporte3') }}">

                    🤖 Reporte 3

                </a>

            </div>

            <!-- SALIR -->
            <a href="{{ url_for('views.logout') }}">

                <i class="bi bi-box-arrow-right"></i>

                Cerrar Sesión

            </a>

        </div>

    </div>

    <!-- =====================================
         CONTENIDO
    ====================================== -->
    <div class="main-content">

        {% block content %}

        {% endblock %}

    </div>

    <!-- =====================================
         FOOTER
    ====================================== -->
    <footer>

        <strong>
            SISTEMA WEB DE FERRETERÍA
        </strong>

        <br>

        COPYRIGHT © 2026

    </footer>

    <!-- =====================================
         JS
    ====================================== -->
    <script>

        function toggleReportes() {

            document
                .getElementById(
                    'submenu-reportes'
                )
                .classList
                .toggle('show');
        }

    </script>

    <!-- BOOTSTRAP -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

</body>

</html>
