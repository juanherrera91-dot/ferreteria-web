<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ferretería System</title>

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        body {
            background: #f4f6f9;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        /* Navbar */
        .navbar {
            background: #212529;
            padding: 10px 20px;
        }

        /* Contenedor principal del menú */
        .navbar-container {
            width: 100%;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        /* Logo */
        .logo-menu img {
            max-height: 60px;
        }

        /* Grupo de botones */
        .menu-group {
            display: flex;
            gap: 10px;
        }

        .navbar a {
            color: white;
            text-decoration: none;
        }

        .navbar a:hover {
            color: #ffc107;
        }

        /* Contenido */
        .content {
            flex: 1;
        }

        /* Footer */
        footer {
            background: #212529;
            color: white;
            text-align: center;
            padding: 15px;
            margin-top: 20px;
        }

    </style>

</head>

<body>

    <!-- MENÚ -->
    <nav class="navbar">

        <div class="navbar-container">

            <!-- LOGO IZQUIERDA -->
            <div class="logo-menu">
                <img src="{{ url_for('static', filename='logo.png') }}" alt="Logo Ferretería">
            </div>

            <!-- BOTONES -->
            <div class="menu-group">

                <a href="/dashboard" class="btn btn-primary">
                    🏠 Home
                </a>

                <a href="/productos" class="btn btn-success">
                    🔧 Productos
                </a>

                <a href="/ventas" class="btn btn-info">
                    💰 Ventas
                </a>

                <a href="/reporte" class="btn btn-warning">
                    📊 Reportes
                </a>

                <a href="/logout" class="btn btn-danger">
                    🚪 Salir
                </a>

            </div>

        </div>

    </nav>

    <!-- CONTENIDO -->
    <div class="container mt-4 content">
        {% block content %}{% endblock %}
    </div>

    <!-- PIE DE PÁGINA -->
    <footer>
        <h5>SISTEMA DE FERRETERÍA COPYRIGHT 2026</h5>
    </footer>

</body>
</html>
