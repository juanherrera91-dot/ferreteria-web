<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- Bootstrap 5 -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <title>Nueva Venta</title>

    <style>
        body{
            background: linear-gradient(135deg, #0d6efd, #6610f2);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .card-venta{
            width: 100%;
            max-width: 650px;
            border: none;
            border-radius: 20px;
            overflow: hidden;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
        }

        .card-header{
            background: #198754;
            color: white;
            text-align: center;
            padding: 25px;
        }

        .titulo{
            font-size: 28px;
            font-weight: bold;
        }

        .btn-venta{
            border-radius: 12px;
            font-size: 18px;
            font-weight: bold;
            transition: 0.3s;
        }

        .btn-venta:hover{
            transform: scale(1.03);
        }

        .form-select{
            border-radius: 12px;
            padding: 12px;
        }
    </style>
</head>

<body>

    <div class="card card-venta">

        <div class="card-header">
            <h2 class="titulo">🛒 Registrar Nueva Venta</h2>
            <p class="mb-0">Seleccione un cliente para continuar</p>
        </div>

        <div class="card-body p-4">

            <form action="/crear_venta" method="POST">

                <div class="mb-4">

                    <label class="form-label fw-bold">
                        👤 Cliente
                    </label>

                    <select name="cliente_id"
                            class="form-select form-select-lg"
                            required>

                        <option value="">
                            Seleccione Cliente
                        </option>

                        {% if clientes %}

                            {% for c in clientes %}

                                <option value="{{ c.id }}">
                                    {{ c.nombre }}
                                </option>

                            {% endfor %}

                        {% endif %}

                    </select>

                </div>

                <div class="d-grid">

                    <button type="submit"
                            class="btn btn-success btn-lg btn-venta">

                        ➕ Crear Nueva Venta

                    </button>

                </div>

            </form>

        </div>

    </div>

</body>
</html>
