{% extends "base.html" %}

{% block content %}

<div class="container mt-4">

    <div class="d-flex justify-content-between align-items-center mb-3">
        <h3>🧾 Gestión de Ventas</h3>

        <a href="/crear_venta" class="btn btn-success">
            + Nueva Venta
        </a>
    </div>

    <div class="card shadow">
        <div class="card-body">

            <table class="table table-hover table-striped align-middle">
                <thead class="table-dark">
                    <tr>
                        <th>ID</th>
                        <th>Fecha</th>
                        <th>Acciones</th>
                    </tr>
                </thead>

                <tbody>
                    {% for v in ventas %}
                    <tr>
                        <td>{{ v.id }}</td>
                        <td>{{ v.fecha }}</td>
                        <td>
                            <a href="/venta_detalle/{{ v.id }}" class="btn btn-primary btn-sm">
                                👁 Ver Venta
                            </a>
                        </td>
                    </tr>
                    {% endfor %}
                </tbody>

            </table>

        </div>
    </div>

</div>

{% endblock %}
