<!DOCTYPE html>
<html lang="es">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>SISFERR | Login</title>

    <!-- BOOTSTRAP -->
    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >

    <!-- ICONOS -->
    <link
        rel="stylesheet"
        href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"
    >

    <style>

        body {
            background: linear-gradient(135deg, #1e293b, #0f172a);
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: Arial, sans-serif;
        }

        .login-card {
            width: 400px;
            border: none;
            border-radius: 20px;
            padding: 30px;
            background: white;
            box-shadow: 0px 10px 30px rgba(0,0,0,0.3);
        }

        .logo {
            font-size: 50px;
            text-align: center;
            margin-bottom: 10px;
        }

        .title {
            text-align: center;
            font-weight: bold;
            color: #0f172a;
        }

        .subtitle {
            text-align: center;
            color: gray;
            margin-bottom: 25px;
        }

        .form-control {
            border-radius: 10px;
            height: 45px;
        }

        .btn-login {
            background: #2563eb;
            border: none;
            border-radius: 10px;
            height: 45px;
            font-weight: bold;
            transition: 0.3s;
        }

        .btn-login:hover {
            background: #1d4ed8;
        }

        .footer {
            text-align: center;
            margin-top: 20px;
            color: gray;
            font-size: 12px;
        }

    </style>

</head>

<body>

    <div class="login-card">

        <!-- LOGO -->
        <div class="logo">
            🔧
        </div>

        <h2 class="title">
            SISFERR
        </h2>

        <p class="subtitle">
            Sistema de Gestión Ferretería
        </p>

        <!-- MENSAJES FLASH -->
       <!-- ALERTA FLOTANTE -->
{% with messages = get_flashed_messages(with_categories=true) %}

    {% if messages %}

        <div class="alert-container">

            {% for category, message in messages %}

                <div
                    class="alert alert-{{ category }} alert-dismissible fade show floating-alert"
                    role="alert">

                    <i class="bi bi-exclamation-triangle-fill me-2"></i>

                    {{ message }}

                    <button
                        type="button"
                        class="btn-close"
                        data-bs-dismiss="alert">
                    </button>

                </div>

            {% endfor %}

        </div>

    {% endif %}

{% endwith %}
        <!-- FORMULARIO -->
        <form method="POST">

            <!-- USUARIO -->
            <div class="mb-3">

                <label class="form-label fw-bold">
                    Usuario
                </label>

                <div class="input-group">

                    <span class="input-group-text">
                        <i class="bi bi-person-fill"></i>
                    </span>

                    <input
                        type="text"
                        class="form-control"
                        name="username"
                        placeholder="Ingrese usuario"
                        required
                    >

                </div>

            </div>

            <!-- PASSWORD -->
            <div class="mb-3">

                <label class="form-label fw-bold">
                    Contraseña
                </label>

                <div class="input-group">

                    <span class="input-group-text">
                        <i class="bi bi-lock-fill"></i>
                    </span>

                    <input
                        type="password"
                        class="form-control"
                        name="password"
                        placeholder="Ingrese contraseña"
                        required
                    >

                </div>

            </div>

            <!-- BOTON -->
            <button type="submit" class="btn btn-primary btn-login w-100">

                <i class="bi bi-box-arrow-in-right"></i>

                Ingresar

            </button>

        </form>

        <!-- FOOTER -->
        <div class="footer">
            Sistema SISFERR © 2026
        </div>

    </div>

    <!-- BOOTSTRAP JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

</body>

</html>
