<!DOCTYPE html>
<html>
<head>
    <title>SISFERR - Login</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        body {
            background: linear-gradient(135deg, #1c1c1c, #2c3e50);
        }

        .card {
            border-radius: 20px;
        }

        .title {
            font-weight: bold;
            color: #2c3e50;
        }
    </style>
</head>

<body class="d-flex justify-content-center align-items-center" style="height:100vh;">

<div class="card p-4 shadow" style="width:380px;">

    <h3 class="text-center title">🔧 SISFERR</h3>
    <p class="text-center text-muted">Sistema de Ferretería</p>

    <!-- 🔴 MENSAJE DE ERROR (IMPORTANTE) -->
    {% if error %}
        <div class="alert alert-danger text-center">
            {{ error }}
        </div>
    {% endif %}

    <form method="POST">

        <label class="form-label">Usuario</label>
        <input class="form-control" name="username" placeholder="Ingrese usuario" required>

        <label class="form-label mt-2">Contraseña</label>
        <input class="form-control" type="password" name="password" placeholder="Ingrese contraseña" required>

        <button class="btn btn-primary w-100 mt-3">
            🔐 Ingresar
        </button>

    </form>

    <hr>

    <p class="text-center text-muted" style="font-size:12px;">
        Sistema SISFERR © 2026
    </p>

</div>

</body>
</html>
