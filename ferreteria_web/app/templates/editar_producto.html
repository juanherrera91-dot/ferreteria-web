{% extends "base.html" %}

{% block content %}

<h2>✏ Editar Producto</h2>

<form method="POST">

    <div class="mb-3">
        <label>Nombre</label>

        <input type="text"
               name="nombre"
               class="form-control"
               value="{{ producto.nombre }}"
               required>
    </div>

    <div class="mb-3">
        <label>Precio</label>

        <input type="number"
               step="0.01"
               name="precio"
               class="form-control"
               value="{{ producto.precio }}"
               required>
    </div>

    <div class="mb-3">
        <label>Stock</label>

        <input type="number"
               name="stock"
               class="form-control"
               value="{{ producto.stock }}"
               required>
    </div>

    <div class="mb-3">
        <label>Categoría</label>

        <select name="categoria" class="form-control">

            {% for c in categorias %}

                <option value="{{ c.id }}"
                    {% if producto.categoria_id == c.id %}
                        selected
                    {% endif %}>

                    {{ c.nombre }}

                </option>

            {% endfor %}

        </select>
    </div>

    <button class="btn btn-primary">
        💾 Guardar Cambios
    </button>

    <a href="/productos" class="btn btn-secondary">
        Cancelar
    </a>

</form>

{% endblock %}
