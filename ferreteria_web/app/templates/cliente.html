<!DOCTYPE html>
{% extends "base.html" %}

{% block content %}

<div class="container mt-4">

    <h2 class="fw-bold">
        👤 Clientes
    </h2>

    <div class="card shadow p-4 mb-4">

        <form method="POST" action="/add_cliente">

            <div class="row">

                <div class="col-md-4">
                    <input class="form-control"
                           name="nombre"
                           placeholder="Nombre"
                           required>
                </div>

                <div class="col-md-4">
                    <input class="form-control"
                           name="telefono"
                           placeholder="Teléfono">
                </div>

                <div class="col-md-4">
                    <input class="form-control"
                           name="direccion"
                           placeholder="Dirección">
                </div>

            </div>

            <button class="btn btn-success mt-3">
                ➕ Guardar Cliente
            </button>

        </form>

    </div>

    <table class="table table-bordered table-hover">

        <thead class="table-dark">

            <tr>
                <th>ID</th>
                <th>Nombre</th>
                <th>Teléfono</th>
                <th>Dirección</th>
                <th>Acciones</th>
            </tr>

        </thead>

        <tbody>

            {% for c in clientes %}

            <tr>

                <td>{{ c.id }}</td>
                <td>{{ c.nombre }}</td>
                <td>{{ c.telefono }}</td>
                <td>{{ c.direccion }}</td>

                <td>

                    <a href="/delete_cliente/{{ c.id }}"
                       class="btn btn-danger btn-sm">

                        🗑 Eliminar

                    </a>

                </td>

            </tr>

            {% endfor %}

        </tbody>

    </table>

</div>

{% endblock %}
