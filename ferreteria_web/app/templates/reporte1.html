{% extends "base.html" %}

{% block content %}

<div class="container mt-4">

    <h2 class="fw-bold mb-4">
        📊 Reporte 1 — Análisis General
    </h2>

    <div class="row g-3">

        <div class="col-md-3">
            <div class="card bg-primary text-white shadow">
                <div class="card-body">
                    <h5>Total Ventas</h5>
                    <h2>{{ total_ventas }}</h2>
                </div>
            </div>
        </div>

        <div class="col-md-3">
            <div class="card bg-success text-white shadow">
                <div class="card-body">
                    <h5>Productos</h5>
                    <h2>{{ total_productos }}</h2>
                </div>
            </div>
        </div>

        <div class="col-md-3">
            <div class="card bg-warning shadow">
                <div class="card-body">
                    <h5>Clientes</h5>
                    <h2>{{ total_clientes }}</h2>
                </div>
            </div>
        </div>

        <div class="col-md-3">
            <div class="card bg-danger text-white shadow">
                <div class="card-body">
                    <h5>Ingresos</h5>
                    <h2>Bs {{ ingresos }}</h2>
                </div>
            </div>
        </div>

    </div>

    <div class="card shadow mt-4">

        <div class="card-header bg-dark text-white">
            📈 Gráfica Principal
        </div>

        <div class="card-body text-center">

            <img
                src="data:image/png;base64,{{ grafica }}"
                class="img-fluid">

        </div>

    </div>

    <div class="card shadow mt-4">

        <div class="card-header bg-primary text-white">
            🤖 Análisis IA
        </div>

        <div class="card-body">

            <p style="white-space: pre-line;">
                {{ analisis }}
            </p>

        </div>

    </div>

</div>

{% endblock %}
